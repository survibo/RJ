{code:'BC',title:'GCD · LCM 결합',group:'number',description:'현재 전체 배열의 최대공약수 g 또는 최소공배수 L을 구해 더하거나 곱합니다.',options:opt(keep,['addG','x + 최대공약수 g'],['mulG','x × 최대공약수 g'],['addL','x + 최소공배수 L'],['mulL','x × 최소공배수 L']),default:'addG'}

const BY_CODE=Object.fromEntries(RULES.map(r=>[r.code,r]));
const FUNCTIONS=opt(['keep','그대로'],['add','상수 더하기'],['mul','상수 곱하기'],['pow','거듭제곱'],['mod','((x−1) mod n) + 1'],['reverse','자릿수 반전'],['sum','자릿수 합'],['product','0 제외 자릿수 곱']);
function makeStep(code){const def=BY_CODE[code];if(!def)throw Error('없는 규칙입니다.');return {id:uid(),code,mode:def.default,c:'2',k:code==='B'?'1':'2',a:'2',b:'3',t:'10',period:'2, 5, 3',fn:'add',fc:'2'};}
function functionLabel(s){return ({keep:'그대로',add:`+${s.fc}`,mul:`×${s.fc}`,pow:`지수 ${s.fc}`,mod:'((x−1) mod n)+1',reverse:'자릿수 반전',sum:'자릿수 합',product:'0 제외 자릿수 곱'})[s.fn];}
function summary(s){const d=BY_CODE[s.code];if(!d)return '';if(s.mode==='keep')return '그대로 유지';switch(s.code){case'B':return `${s.mode==='left'?'왼쪽':'오른쪽'} ${s.k}칸`;case'I':return `각 값 + ${s.c}`;case'J':return `각 값 × ${s.c}`;case'K':return s.mode==='pow'?`각 값의 ${s.k}제곱`:s.mode==='square'?'각 값의 제곱':'각 값의 세제곱';case'Q':return `${s.mode==='kth'?s.k+'번째 원소':d.options.find(o=>o.key===s.mode)?.label} → r 저장`;case'Y':return `홀수 ${s.mode==='add'?'+':'×'}${s.a} · 짝수 ${s.mode==='add'?'+':'×'}${s.b}`;case'AO':return `${s.mode==='add'?'덧셈':'곱셈'} 주기 [${s.period}]`;case'Z':case'AB':case'AJ':return `${s.mode==='threshold'?'값 ≥ '+s.t:d.options.find(o=>o.key===s.mode)?.label} → ${functionLabel(s)}`;default:return d.options.find(o=>o.key===s.mode)?.label||s.mode;}}


const MAX_DIGITS=10000;
function integer(value,label='값',zero=false){if(!/^\d+$/.test(String(value).trim()))throw Error(`${label}은 ${zero?'0 이상의':'양의'} 정수로 입력해 주세요.`);if(String(value).length>MAX_DIGITS)throw Error('계산 가능한 자릿수를 초과했습니다. 상수를 줄여 주세요.');const v=BigInt(String(value).trim());if(v<(zero?0n:1n))throw Error(`${label}은 ${zero?'0 이상':'1 이상'}이어야 합니다.`);return v;}
function parseInput(raw,nRaw){const n=integer(nRaw,'값의 상한 n');const parts=String(raw).trim().split(/[\s,]+/).filter(Boolean);if(!parts.length)throw Error('입력 배열에 원소를 한 개 이상 넣어 주세요.');if(parts.length>1000)throw Error('이 화면에서는 배열을 1,000개 원소까지 계산할 수 있습니다.');const values=parts.map(x=>integer(x,'입력 원소'));if(values.some(x=>x>n))throw Error('입력 원소는 모두 1~n 범위여야 합니다.');if(new Set(values.map(String)).size!==values.length)throw Error('최초 입력에는 중복값을 넣을 수 없습니다.');return {n,values};}
function checked(x){if(x.toString().length>MAX_DIGITS)throw Error('중간값이 10,000자리를 넘어 계산을 멈췄습니다. 지수나 상수를 줄여 주세요.');return x;}
function pow(x,e){if(x===1n||e===1n)return x;const bits=BigInt(x.toString(2).length);if((bits-1n)*e>33220n)throw Error('거듭제곱 결과가 계산 한도를 넘습니다. 지수를 줄여 주세요.');return checked(x**e);}
function digits(x,mode){const chars=x.toString().split('');if(mode==='reverse')return BigInt(chars.reverse().join(''));if(mode==='sum')return chars.reduce((v,d)=>v+BigInt(d),0n);return chars.filter(d=>d!=='0').reduce((v,d)=>checked(v*BigInt(d)),1n);}
const min=xs=>xs.reduce((a,b)=>a<b?a:b),max=xs=>xs.reduce((a,b)=>a>b?a:b),sum=xs=>xs.reduce((a,b)=>checked(a+b),0n);
const gcd=(a,b)=>{while(b){[a,b]=[b,a%b];}return a;};
function factors(x){if(x===1n)return {smallest:1n,largest:1n,omega:1n,distinct:1n};let rest=x,d=2n,first=0n,last=1n,count=0n,distinct=0n,ticks=0;while(d*d<=rest){if(++ticks>300000)throw Error('소인수 계산이 너무 큽니다. 앞에 중간 모듈러 M을 넣거나 더 작은 값으로 실행해 주세요.');if(rest%d===0n){distinct++;if(!first)first=d;last=d;while(rest%d===0n){rest/=d;count++;}}d=d===2n?3n:d+2n;}if(rest>1n){if(!first)first=rest;last=rest;count++;distinct++;}return {smallest:first,largest:last,omega:count+1n,distinct:distinct+1n};}
function fnFor(s,n){if(!FUNCTIONS.some(f=>f.key===s.fn))throw Error('조건에 적용할 변환을 선택해 주세요.');const c=['add','mul','pow'].includes(s.fn)?integer(s.fc,'변환 상수'):1n;return x=>{switch(s.fn){case'keep':return x;case'add':return checked(x+c);case'mul':return checked(x*c);case'pow':return pow(x,c);case'mod':return (x-1n)%n+1n;default:return digits(x,s.fn);}};}
function applyStep(xs,s,n,r){const def=BY_CODE[s.code];if(!def||!def.options.some(o=>o.key===s.mode))throw Error('유효하지 않은 규칙 선택지입니다.');const m=xs.length;let ys=[...xs],mask=null;const info={r,detail:''};if(s.mode==='keep')return {values:ys,...info,mask};
switch(s.code){
case'A':{const sorted=[...xs].sort((a,b)=>a<b?-1:a>b?1:0);if(s.mode==='asc')ys=sorted;else if(s.mode==='desc')ys=sorted.reverse();else{ys=[];let lo=0,hi=m-1,takeHigh=s.mode==='high';while(lo<=hi){ys.push(takeHigh?sorted[hi--]:sorted[lo++]);takeHigh=!takeHigh;}}break;}
case'B':{const k=Number(integer(s.k,'이동량 k',true)%BigInt(m));const shift=s.mode==='left'?k:(m-k)%m;ys=[...xs.slice(shift),...xs.slice(0,shift)];info.detail=`길이 ${m} 기준 · 실제 ${k}칸`;break;}
case'C':ys.reverse();break;
case'D':{const idx=xs.map((_,i)=>i).filter(i=>i%2===(s.mode==='odd'?0:1));const values=idx.map(i=>xs[i]).reverse();idx.forEach((v,i)=>ys[v]=values[i]);break;}
case'E':{if(s.mode==='inverse')ys=[...xs.filter((_,i)=>i%2===0),...xs.filter((_,i)=>i%2===1)];else{ys=[];const half=Math.ceil(m/2);for(let i=0;i<half;i++){ys.push(xs[i]);if(i+half<m)ys.push(xs[i+half]);}}break;}
case'I':{const c=integer(s.c,'상수 c');ys=xs.map(x=>checked(x+c));break;}
case'J':{const c=integer(s.c,'상수 c');ys=xs.map(x=>checked(x*c));break;}
case'K':{const e=s.mode==='square'?2n:s.mode==='cube'?3n:integer(s.k,'지수 k');ys=xs.map(x=>pow(x,e));break;}
case'M':ys=xs.map(x=>(x-1n)%n+1n);break;
case'P':ys=xs.map(x=>digits(x,s.mode));break;
case'Q':{let value;if(s.mode==='first')value=xs[0];else if(s.mode==='last')value=xs[m-1];else if(s.mode==='min')value=min(xs);else if(s.mode==='max')value=max(xs);else{const k=integer(s.k,'선택 위치 k');if(k>BigInt(m))throw Error(`선택 위치 k는 배열 길이 ${m} 이하여야 합니다.`);value=xs[Number(k)-1];}info.r=value;info.detail='기준값 저장 · 배열 유지';break;}
case'R':if(r===null)throw Error('앞에 Q를 추가해 기준값 r을 먼저 저장해 주세요.');ys=xs.map(x=>checked(s.mode==='add'?x+r:x*r));info.detail='앞선 Q의 저장값 사용';break;
case'S':{const v=s.mode==='sum'?sum(xs):s.mode==='min'?min(xs):max(xs);ys=xs.map(x=>checked(x+v));info.detail=`모든 원소에 +${v}`;break;}
case'AF':ys=xs.map((x,i)=>{const y=xs[(i+1)%m];return checked(s.mode==='sum'?x+y:s.mode==='product'?x*y:(y-x)**2n+1n);});info.detail='마지막 ↔ 첫 원소 연결';break;
case'AG':for(let i=0;i+1<m;i+=2)[ys[i],ys[i+1]]=[ys[i+1],ys[i]];break;
case'X':ys=xs.map((x,i)=>s.mode==='pow'?pow(x,BigInt(i+1)):checked(s.mode==='add'?x+BigInt(i+1):x*BigInt(i+1)));break;
case'Y':{const a=integer(s.a,'홀수 위치 상수 a'),b=integer(s.b,'짝수 위치 상수 b');ys=xs.map((x,i)=>checked(s.mode==='add'?x+(i%2===0?a:b):x*(i%2===0?a:b)));break;}
case'Z':case'AB':case'AJ':{const transform=fnFor(s,n);const total=s.code==='AB'?sum(xs):0n;const t=s.code==='AJ'&&s.mode==='threshold'?integer(s.t,'기준값 t'):1n;mask=xs.map((x,i)=>{if(s.code==='Z')return x%2n===(s.mode==='even'?0n:1n);if(s.code==='AB')return s.mode==='above'?x*BigInt(m)>total:s.mode==='below'?x*BigInt(m)<total:x>xs[(i+m-1)%m];return s.mode==='all'?true:s.mode==='oddIndex'?i%2===0:s.mode==='evenIndex'?i%2===1:s.mode==='oddValue'?x%2n===1n:s.mode==='evenValue'?x%2n===0n:x>=t;});ys=xs.map((x,i)=>mask[i]?transform(x):x);info.detail=`${mask.filter(Boolean).length}개 원소 선택`;break;}
case'AO':{const values=String(s.period).trim().split(/[\s,]+/).filter(Boolean).map(v=>integer(v,'주기 상수'));if(!values.length)throw Error('주기 상수를 한 개 이상 입력해 주세요.');ys=xs.map((x,i)=>checked(s.mode==='add'?x+values[i%values.length]:x*values[i%values.length]));info.detail=`주기 ${values.length} · 첫 위치부터 반복`;break;}
case'BA':{const memo=new Map();ys=xs.map(x=>{const k=x.toString();if(!memo.has(k))memo.set(k,factors(x));return memo.get(k)[s.mode];});break;}
case'BC':{const v=s.mode.endsWith('G')?xs.reduce(gcd):xs.reduce((a,b)=>checked((a/gcd(a,b))*b));ys=xs.map(x=>checked(s.mode.startsWith('add')?x+v:x*v));info.detail=`${s.mode.endsWith('G')?'최대공약수 g':'최소공배수 L'} = ${v}`;break;}
}
if(ys.some(x=>x<1n))throw Error('양의 정수 조건을 벗어난 결과입니다.');return {values:ys,...info,mask};}
function runPipeline(input,onStage=()=>{}){const {n,values}=parseInput(input.raw,input.n);let xs=values,r=null;const stages=[];for(let i=0;i<input.steps.length;i++){const s=input.steps[i];try{const applied=applyStep(xs,s,n,r);xs=applied.values;r=applied.r;const stage={index:i,id:s.id,values:xs.map(String),r:r===null?null:String(r),detail:applied.detail,mask:applied.mask};stages.push(stage);onStage(stage);}catch(e){return {error:e.message,errorIndex:i,stages,n:String(n),initial:values.map(String)};}}return {stages,final:xs.map(x=>String((x-1n)%n+1n)),initial:values.map(String),n:String(n)};}

function paramNames(s){if(s.mode==='keep')return [];const names=[];if(['I','J'].includes(s.code))names.push('c');if(s.code==='B'||(s.code==='K'&&s.mode==='pow')||(s.code==='Q'&&s.mode==='kth'))names.push('k');if(s.code==='Y')names.push('a','b');if(s.code==='AO')names.push('period');if(s.code==='AJ'&&s.mode==='threshold')names.push('t');if(['Z','AB','AJ'].includes(s.code)){names.push('fn');if(['add','mul','pow'].includes(s.fn))names.push('fc');}return names;}
function stepSpec(s){return [`${s.code}:${s.mode}`,...paramNames(s).map(k=>`${k}=${k==='period'?String(s.period).trim().split(/[\s,]+/).filter(Boolean).join('/'):String(s[k]).trim()}`)].join(',');}
function rulesSpec(steps){return steps.map(stepSpec).join(' > ');}
